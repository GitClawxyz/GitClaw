<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <radialGradient id="bannerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#003d0f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#020c04" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" fill="#020c04"/>
  <rect width="900" height="300" fill="url(#bannerGlow)"/>

  <!-- Grid -->
  <g stroke="#0a2e0f" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="500" y1="0" x2="500" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="700" y1="0" x2="700" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
  </g>

  <!-- Left claw icon (small) -->
  <g transform="translate(60, 150) scale(0.5)">
    <path d="M 80 80 Q 40 55 20 10 Q 13 -5 23 -15 Q 33 -25 43 -10 Q 58 15 65 50 Q 72 68 80 80" fill="#00ff41" opacity="0.8" filter="url(#glow)"/>
    <path d="M 80 80 Q 120 55 140 10 Q 147 -5 137 -15 Q 127 -25 117 -10 Q 102 15 95 50 Q 88 68 80 80" fill="#00ff41" opacity="0.8" filter="url(#glow)"/>
    <path d="M 80 80 Q 73 55 70 30 Q 68 5 80 -8 Q 92 5 90 30 Q 87 55 80 80" fill="#00ff41" opacity="1" filter="url(#glow)"/>
    <path d="M 53 86 Q 62 98 80 100 Q 98 98 107 86 Q 113 78 110 70 Q 99 74 80 75 Q 61 74 50 70 Q 47 78 53 86 Z" fill="#00ff41" opacity="0.85" filter="url(#glow)"/>
  </g>

  <!-- Main title -->
  <text x="450" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="72" font-weight="900" letter-spacing="16" fill="#00ff41" filter="url(#textGlow)">GITCLAW</text>

  <!-- Subtitle -->
  <text x="450" y="160" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="6" fill="#4a8a55">CLAW YOUR WAY TO THE TOP</text>

  <!-- Bottom info row -->
  <text x="200" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" letter-spacing="2" fill="#003d0f">▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓</text>

  <!-- Badges row -->
  <rect x="250" y="228" width="100" height="24" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <text x="300" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#00ff41">⬡ BASE</text>

  <rect x="365" y="228" width="80" height="24" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <text x="405" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#00ff41">0% TAX</text>

  <rect x="460" y="228" width="90" height="24" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <text x="505" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#00ff41">🔒 SAFU</text>

  <rect x="565" y="228" width="120" height="24" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
  <text x="625" y="244" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#00ff41">FAIR LAUNCH</text>

  <!-- Terminal prompt bottom -->
  <text x="450" y="278" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#1a4a22">root@base:~$ ./gitclaw --deploy --chain base --ticker $GCLAW ▌</text>

  <!-- Corner brackets -->
  <g stroke="#00ff41" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="10,20 10,8 22,8"/>
    <polyline points="878,8 890,8 890,20"/>
    <polyline points="10,280 10,292 22,292"/>
    <polyline points="878,292 890,292 890,280"/>
  </g>
</svg>
